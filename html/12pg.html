
<!DOCTYPE html>
<html>
<head>
    <title>Employee Salary Information</title>

    <style>
        body {
            font-family: Arial;
        }

        .box {
            width: 350px;
            padding: 20px;
            border: 1px solid black;
        }

        input, select {
            margin: 5px;
            padding: 5px;
        }
    </style>
</head>

<body>

    <h2>Employee Salary Information</h2>

    <div class="box">

        <label>Employee Name:</label>
        <input type="text" id="name">
        <br>

        <label>Employee ID:</label>
        <input type="text" id="empid">
        <br>

        <label>Designation:</label>
        <select id="designation">
            <option value="Manager">Manager</option>
            <option value="HR">HR</option>
            <option value="Developer">Developer</option>
            <option value="Sales">Sales</option>
        </select>
        <br>

        <label>Basic Salary:</label>
        <input type="number" id="salary">
        <br><br>

        <button onclick="calculate()">Calculate</button>

        <div id="result"></div>

    </div>

    <script>
        function calculate() {
            var name = document.getElementById("name").value;
            var empid = document.getElementById("empid").value;
            var designation =
                document.getElementById("designation").value;
            var salary =
                Number(document.getElementById("salary").value);

            var hra = salary * 0.15;
            var da = salary * 0.20;
            var pf = salary * 0.05;

            var gross = salary + hra + da;
            var net = gross - pf;

            document.getElementById("result").innerHTML =
                "<h3>Employee Salary Information</h3>" +
                "Employee Name: " + name + "<br>" +
                "Employee ID: " + empid + "<br>" +
                "Designation: " + designation + "<br>" +
                "Basic Salary: " + salary + "<br>" +
                "HRA: " + hra + "<br>" +
                "DA: " + da + "<br>" +
                "PF: " + pf + "<br>" +
                "Gross Salary: " + gross + "<br>" +
                "Net Salary: " + net;
        }
    </script>

</body>
</html>
