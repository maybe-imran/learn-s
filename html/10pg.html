```html
<!DOCTYPE html>
<html>
<head>
    <title>Employee Salary Information</title>
</head>
<body>

    <h2>Employee Salary Information</h2>

    <form>
        <label>Name:</label>
        <input type="text" id="name">
        <br><br>

        <label>Employee ID:</label>
        <input type="text" id="empid">
        <br><br>

        <label>Gender:</label>
        <input type="text" id="gender">
        <br><br>

        <label>Contact:</label>
        <input type="text" id="contact">
        <br><br>

        <label>Address:</label>
        <input type="text" id="address">
        <br><br>

        <label>Basic Salary:</label>
        <input type="number" id="salary">
        <br><br>

        <button type="button" onclick="calculate()">
            Calculate
        </button>
    </form>

    <p id="result"></p>

    <script>
        function calculate() {
            var name = document.getElementById("name").value;
            var empid = document.getElementById("empid").value;
            var gender = document.getElementById("gender").value;
            var contact = document.getElementById("contact").value;
            var address = document.getElementById("address").value;
            var salary = Number(document.getElementById("salary").value);

            var hra = salary * 0.15;
            var da = salary * 0.20;
            var pf = salary * 0.05;
            var gross = salary + hra + da;
            var net = gross - pf;

            document.getElementById("result").innerHTML =
                "<h3>Employee Salary Information</h3>" +
                "Employee Name: " + name + "<br>" +
                "Employee ID: " + empid + "<br>" +
                "Gender: " + gender + "<br>" +
                "Contact: " + contact + "<br>" +
                "Address: " + address + "<br>" +
                "Basic Salary: " + salary + "<br>" +
                "HRA: " + hra + "<br>" +
                "DA: " + da + "<br>" +
                "PF: " + pf + "<br>" +
                "Gross Salary: " + gross + "<br>" +
                "Net Salary: " + net;
        }
    </script>

</body>
</html>
