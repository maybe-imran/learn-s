<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text box</title>
</head>
<body>
    <form action="" method="post">
        <label>name</label>
        <input type="text" name = "name" id="name">
        <br>
        <br>
        <label>gender</label>
        <input type="text" name="gender" id="gender">
        <br>
        <br>
        <label>contact</label>
        <input type="text" name="contact" id="contact">
        <br>
        <br>
        <label>address</label>
        <input type="text" name="address" id="address">
        <br>
        <br>
        <input type="submit" value="validate" onclick="validate()">
        <br>
    </form>
    <script>
        function validate(){
            let textname=document.getElementById('name').value;
            let textgender=document.getElementById('gender').value;
            let textcontact=document.getElementById('contact').value;
            let textaddress=document.getElementById('address').value;
            
            if(textname==""){
                alert('please enter name : ');
            }

            if(textgender==""){
                alert('please enter gender : ');
            }

            if(textcontact==""){
                alert('please enter contact: ');
            }

            if(textaddress==""){
                alert('please enter address');
            }

        }
    </script>
</body>
</html>
