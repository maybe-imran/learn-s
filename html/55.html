
<!DOCTYPE html>
<html>
<head>
    <title>BCA Time Table</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
        }

        h2 {
            text-align: center;
        }

        table {
            border-collapse: collapse;
            background-color: lightblue;
            width: 80%;
            margin: 0 auto;
        }

        th, td {
            border: 1px solid gray;
            padding: 10px;
            text-align: left;
        }

        th {
            text-align: center;
        }

        .lunch {
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <h2>BCA Time Table</h2>

    <table>
        <tr>
            <th>Day</th>
            <th>9:00-10:00</th>
            <th>10:00-11:00</th>
            <th>11:00-12:00</th>
            <th>12:00-1:00</th>
            <th>1:00-1:30</th>
            <th>1:30-2:30</th>
            <th>2:30-3:30</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>--</td>
            <td>SE</td>
            <td>DM</td>
            <td>WT</td>
            <td rowspan="6" class="lunch">Lunch Break</td>
            <td colspan="2">DM Lab</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>--</td>
            <td>SE</td>
            <td>DM</td>
            <td>WT</td>
            <td colspan="2">WT Lab</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>--</td>
            <td>SE</td>
            <td>DM</td>
            <td>WT</td>
            <td colspan="2">WT Lab</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>--</td>
            <td>SE</td>
            <td>DM</td>
            <td>WT</td>
            <td colspan="2">WT Lab</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>--</td>
            <td>SE</td>
            <td>DM</td>
            <td>WT</td>
            <td colspan="2">DM Lab</td>
        </tr>

        <tr>
            <td>Saturday</td>
            <td>--</td>
            <td>WT</td>
            <td>SE</td>
            <td>DM</td>
            <td colspan="2">DM Lab</td>
        </tr>
    </table>

</body>
</html>
