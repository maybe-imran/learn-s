<!DOCTYPE html>
<html>
<head>
    <title>Area of Rectangle</title>
</head>
<body>

    <script>
        let l = parseInt(prompt("Enter the length of rectangle"));
        let b = parseInt(prompt("Enter the breadth of rectangle"));

        let area = l * b;

        document.write("<h3>The area of rectangle is: " + area + "</h3>");
    </script>

</body>
</html>
