
<!DOCTYPE html>
<html>
<head>
    <title>Student Information</title>
</head>
<body>

    <h2>Student Information</h2>

    <form>
        <label>Name:</label>
        <input type="text" id="name">
        <br><br>

        <label>Roll No:</label>
        <input type="text" id="roll">
        <br><br>

        <label>Subject 1 marks:</label>
        <input type="number" id="sub1">
        <br><br>

        <label>Subject 2 marks:</label>
        <input type="number" id="sub2">
        <br><br>

        <label>Subject 3 marks:</label>
        <input type="number" id="sub3">
        <br><br>

        <button type="button" onclick="calculate()">
            Calculate
        </button>
    </form>

    <div id="result"></div>

    <script>
        function calculate() {
            var name = document.getElementById("name").value;
            var roll = document.getElementById("roll").value;
            var s1 = Number(document.getElementById("sub1").value);
            var s2 = Number(document.getElementById("sub2").value);
            var s3 = Number(document.getElementById("sub3").value);

            var total = s1 + s2 + s3;
            var percentage = (total / 300) * 100;

            document.getElementById("result").innerHTML =
                "<h3>Student Information</h3>" +
                "The student name is " + name + "<br>" +
                "The roll number is " + roll + "<br>" +
                "Subject 1 marks: " + s1 + "<br>" +
                "Subject 2 marks: " + s2 + "<br>" +
                "Subject 3 marks: " + s3 + "<br>" +
                "Total marks: " + total + "<br>" +
                "Percentage: " + percentage.toFixed(2) + "%<br>" +
                "Grade: " +
                (percentage >= 90 ? "A+" :
                 percentage >= 80 ? "A" :
                 percentage >= 70 ? "B" :
                 percentage >= 60 ? "C" :
                 percentage >= 40 ? "D" : "Fail");
        }
    </script>

</body>
</html>
