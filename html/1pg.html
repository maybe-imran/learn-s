<!DOCTYPE html>
<html>
<head>
    <title>formatting tags</title>
</head>
<body>
    <P><b> Aliya &lt; b &gt; </b></P>
    <P><strong> Aliya &lt; strong &gt; </strong></P>
    <P><i> Aliya &lt; i &gt; </i></P>
    <P><em> Aliya &lt; em &gt; </em></P>
    <P><ins> Aliya &lt; ins &gt; </ins></P>
    <P><u> Aliya &lt; u &gt; </u></P>
    <P><del> Aliya &lt; del &gt; </del></P>
    <P><small> Aliya &lt; small &gt; </small></P>
    <P><mark> Aliya &lt; mark &gt; </mark></P>
    <P> a <sup>2</sup> + b <sup>2</sup> </P>
    <P> H <sub>2</sub> O </P>
</body>
</html>
