<!DOCTYPE html>
<html>
<head>
    <title>Table</title>
</head>
<body>
    <table border="1" cellpadding="10"
           cellspacing="0" align="center">
        <caption>Day Time Table</caption>
        <tr>
            <th>Day</th>
            <th>10:00-11:00</th>
            <th>11:00-12:00</th>
            <th>12:00-1:00</th>
        </tr>

        <tr>
            <th>Monday</th>
            <td>WT</td>
            <td>SE</td>
            <td>DM</td>
        </tr>

        <tr>
            <th>Tuesday</th>
            <td>DM</td>
            <td>WT</td>
            <td>SE</td>
        </tr>

        <tr>
            <th>Wednesday</th>
            <td>SE</td>
            <td>DM</td>
            <td>WT</td>
        </tr>

        <tr>
            <th>Thursday</th>
            <td>WT</td>
            <td>SE</td>
            <td>DM</td>
        </tr>

        <tr>
            <th>Friday</th>
            <td>SE</td>
            <td>DM</td>
            <td>WT</td>
        </tr>

        <tr>
            <th>Saturday</th>
            <td>DM</td>
            <td>WT</td>
            <td>SE</td>
        </tr>
    </table>
</body>
</html>
