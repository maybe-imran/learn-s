<!DOCTYPE html>
<html>
<head>
    <title>Paragraph tags</title>
</head>
<body>
    <h1>Aliya</h1>
    <h2>Aliya</h2>
    <h3>Aliya</h3>
    <h4>Aliya</h4>
    <h5>Aliya</h5>
    <h6>Aliya</h6>

    <p>Aliya &lt; b &gt; </p>
    <p><strong>Aliya &lt; strong &gt;</strong></p>
    <p><i>Aliya &lt; i &gt;</i></p>
    <p><em>Aliya &lt; em &gt;</em></p>
    <p><del>Aliya &lt; del &gt;</del></p>
    <p><small>Aliya &lt; small &gt;</small></p>
    <p><sup>2</sup> + <sup>2</sup></p>
    <p>Aliya &lt; big &gt;</p>
</body>
</html>
