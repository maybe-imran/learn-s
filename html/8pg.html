<!DOCTYPE html>
<html>
<head>
    <title>Factorial number</title>
</head>
<body>
    <h2>Enter a number:</h2>

    <input type="text" name="number" id="num">

    <button onclick="fact()">Calculate</button>

    <script>
        function fact() {
            let num = parseInt(document.getElementById("num").value);
            let factorial = 1;

            if (num > 0) {
                for (let i = 1; i <= num; i++) {
                    factorial = factorial * i;
                }

                alert("The factorial of " + num + " is " + factorial);
            }
            else if (num == 0) {
                alert("The factorial of 0 is 1");
            }
            else {
                alert("Invalid Input");
            }
        }
    </script>
</body>
</html>
