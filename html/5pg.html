<!DOCTYPE html>
<html>
<head>
    <title>List</title>
</head>
<body>
    <h2>Ordered list</h2>
    <ol type="A">
        <li>Coke</li>
        <li>Pepsi</li>
        <li>Milk</li>
        <li>Tea</li>
    </ol>

    <h2>Unordered list</h2>
    <ul>
        <li>Chocolate</li>
        <li>Milk</li>
        <li>Cheese</li>
        <li>Banana</li>
    </ul>

    <dl>
        <dt>HTML</dt>
        <dd>HTML is a markup language which is used to
            create web pages.</dd>
    </dl>
</body>
</html>
